<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DRIFTLINE — a hover-bike courier adventure</title>
    <meta name="description" content="Kessa-9 was half-terraformed when the money ran out. Ride the Glass Desert as Ash Varga, a Driftline courier with a second-hand hover-bike, a debt, and a package that shouldn't exist." />
    <meta name="theme-color" content="#14101F" />
    <meta property="og:title" content="DRIFTLINE" />
    <meta property="og:description" content="A 3D open-world hover-bike courier adventure across the Glass Desert of Kessa-9. Playable in the browser." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%images/title/keyart.jpg" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sora:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      /* First-paint splash so the title never flashes unstyled */
      #root { min-height: 100vh; }
      body { margin: 0; background: #14101f; color: #e4d7be; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; font: 600 13px/1.4 "Chakra Petch", ui-monospace, monospace; letter-spacing: 0.42em; color: #ffb454; background: radial-gradient(120% 100% at 50% 20%, #2a2140 0%, #14101f 70%); }
      .boot::after { content: ""; width: 52px; height: 2px; background: linear-gradient(90deg, transparent, #ffb454, transparent); animation: bootscan 1.1s ease-in-out infinite; }
      @keyframes bootscan { 0%,100% { transform: translateX(-40px); opacity: .4 } 50% { transform: translateX(40px); opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">DRIFTLINE</div></div>
    <noscript>DRIFTLINE needs JavaScript — it's a 3D hover-bike game rendered in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
